# Temporary helper (run 10: SDK 58 lock file): runs package commands for mobile/ (npm isn't reachable from
# the coding session) and commits the updated package files back.
name: mobile-deps
on:
  push:
    branches: ['feature/mobile-*']
    paths: ['.github/workflows/mobile-deps.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update packages
        run: |
          set +e
          {
            echo "== plain install"
            if npm install --no-audit --no-fund 2>&1 | tail -30; then :; fi
            if ! npm ci --dry-run --no-audit --no-fund > /dev/null 2>&1; then
              echo "== plain install did not give a clean lock; using legacy-peer-deps"
              echo "legacy-peer-deps=true" > .npmrc
              npm install --no-audit --no-fund 2>&1 | tail -10
            fi
            echo "== ci check"; rm -rf node_modules; npm ci --no-audit --no-fund 2>&1 | tail -10
            echo "== typecheck"; npx tsc --noEmit 2>&1 | tail -20
            echo "== doctor"; npx expo-doctor@latest 2>&1 | tail -8
          } > ../deps-report.txt
      - name: Save
        if: always()
        working-directory: .
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add mobile/package.json mobile/package-lock.json deps-report.txt; git add -f mobile/.npmrc 2>/dev/null || true
          git commit -m "Update mobile packages [skip ci]" && git push
