# Builds the places library for the main cities of every country (run by hand,
# then every three months to pick up new places). The "Places sync" job does the
# actual fetching, a few areas every 15 minutes.
name: Places library (world cities)

on:
  schedule:
    - cron: '17 4 1 */3 *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seed-world-cities.mjs
        env:
          SUPABASE_URL: https://psxwslmsjdtfzneoujea.supabase.co
          # Public anon key (safe to share; the website uses it too).
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzeHdzbG1zamR0ZnpuZW91amVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDI2NTgsImV4cCI6MjA5OTcxODY1OH0.PwBjPd9BcHll38hjGaCMR6JVdwPulpApFsPokx0IpCQ
          PLACES_SYNC_TOKEN: ${{ secrets.PLACES_SYNC_TOKEN }}
