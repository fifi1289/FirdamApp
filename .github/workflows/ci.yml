name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to a clean database
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci-auth-stub.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            # Recipe tables are managed outside these migrations.
            case "$f" in *add_recipe_read_policies*) continue;; esac
            echo "== $f"
            if ! out=$(psql -v ON_ERROR_STOP=1 -q -f "$f" 2>&1); then
              echo "$out"
              echo "::error file=$f::$(echo "$out" | tail -n 3 | tr '\n' ' ')"
              exit 1
            fi
          done
      - name: Re-apply new migrations (idempotency)
        run: |
          for f in $(ls supabase/migrations/2026100*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: RLS smoke test
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci-smoke.sql > smoke.log 2>&1
          status=$?
          cat smoke.log
          if [ $status -ne 0 ]; then
            echo "::error title=RLS smoke test::$(tail -n 4 smoke.log | tr '\n' ' ')"
          fi
          exit $status
