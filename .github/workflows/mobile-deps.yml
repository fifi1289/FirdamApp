# Temporary helper (run 8: expo install --fix again): runs package commands for mobile/ (npm isn't reachable from
# the coding session) and commits the updated package files back.
name: mobile-deps
on:
  push:
    branches: ['feature/mobile-*']
    paths: ['.github/workflows/mobile-deps.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update packages
        run: |
          {
            npm ci --no-audit --no-fund > /dev/null 2>&1
            echo "== fix"; npx expo install --fix 2>&1 | tail -15
            echo "== doctor"; npx expo-doctor 2>&1 | tail -20; echo "doctor exit: ${PIPESTATUS[0]}"
            echo "== tsc"; npx tsc --noEmit 2>&1 | tail -20; echo "tsc exit: ${PIPESTATUS[0]}"
            echo "== versions"; node -p 'const d=require("./package.json").dependencies; JSON.stringify(["expo","expo-location","expo-router","expo-splash-screen","expo-updates"].map(k=>k+"@"+d[k]))'
          } > ../deps-report.txt
      - name: Save
        if: always()
        working-directory: .
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add mobile/package.json mobile/package-lock.json deps-report.txt
          git commit -m "Update mobile packages [skip ci]" && git push
