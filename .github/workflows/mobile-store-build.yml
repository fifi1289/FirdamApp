# Builds the store versions of the Firdam app on Expo (EAS) and, if asked,
# sends them to App Store Connect / Google Play. Run it by hand from
# GitHub → Actions → "Mobile store build" → Run workflow. Nothing to install
# on your computer.
#
# Repository secrets it uses:
#   EXPO_TOKEN     – from expo.dev → Account settings → Access tokens
#   ASC_KEY_ID     – App Store Connect API key ID (iPhone builds)
#   ASC_ISSUER_ID  – App Store Connect issuer ID   (iPhone builds)
#   ASC_KEY_P8     – the whole text of the AuthKey_XXXX.p8 file (iPhone builds)
#   APPLE_TEAM_ID  – your 10-character Apple Team ID (iPhone builds)
# With the Apple key, Expo creates the iPhone certificates by itself.
name: Mobile store build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: Send the builds to the stores when done
        type: boolean
        default: false
      submit_only:
        description: Don't build - just send the latest finished build to the store
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Apple key
        if: ${{ inputs.platform != 'android' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Add the ASC_KEY_P8 secret first (see the publishing guide)"; exit 1; fi
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          # Let "eas submit" upload to App Store Connect with the same key.
          jq --arg p "$RUNNER_TEMP/asc.p8" --arg k "$EXPO_ASC_KEY_ID" --arg i "$EXPO_ASC_ISSUER_ID" \
            '.submit.production.ios += {ascApiKeyPath:$p, ascApiKeyId:$k, ascApiKeyIssuerId:$i}' eas.json > eas.tmp && mv eas.tmp eas.json
      # iPhone signing from GitHub secrets (made once, by hand), so Expo doesn't
      # have to create a certificate in a terminal. The files only exist on
      # this runner; they are never committed.
      - name: iPhone signing files
        if: ${{ inputs.platform != 'android' && !inputs.submit_only }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "::error::Add the IOS_P12_BASE64, IOS_P12_PASSWORD and IOS_PROFILE_BASE64 secrets first (see the publishing guide)"; exit 1
          fi
          mkdir -p ios-signing
          printf '%s' "$IOS_P12_BASE64" | tr -d ' \r\n' | base64 -d > ios-signing/dist.p12
          printf '%s' "$IOS_PROFILE_BASE64" | tr -d ' \r\n' | base64 -d > ios-signing/profile.mobileprovision
          jq -n --arg pw "$IOS_P12_PASSWORD" '{ios:{provisioningProfilePath:"ios-signing/profile.mobileprovision",distributionCertificate:{path:"ios-signing/dist.p12",password:$pw}}}' > credentials.json
          jq '.build.production.ios = ((.build.production.ios // {}) + {credentialsSource:"local"})' eas.json > eas.tmp && mv eas.tmp eas.json
          printf '\ncredentials.json\nios-signing/\n' >> .gitignore
      - name: Send the latest build to the store
        if: ${{ inputs.submit_only }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --latest --non-interactive
      - name: Build
        if: ${{ !inputs.submit_only }}
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait ${{ inputs.submit && '--auto-submit' || '' }}
