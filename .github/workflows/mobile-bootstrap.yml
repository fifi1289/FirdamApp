# Temporary: scaffolds the Expo app in mobile/ with current, compatible package
# versions (npm isn't reachable from the coding session) and commits it back.
name: mobile-bootstrap
on:
  push:
    branches: [feature/mobile-app]
    paths: ['.github/workflows/mobile-bootstrap.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Expo app
        run: |
          set -e
          npx --yes create-expo-app@latest mobile --template blank-typescript --no-install > bootstrap.txt 2>&1 || (cat bootstrap.txt; exit 1)
          cd mobile
          npm install --no-audit --no-fund >> ../bootstrap.txt 2>&1
          npx expo install expo-router react-native-safe-area-context react-native-screens expo-linking expo-constants expo-status-bar \
            @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill \
            expo-font @expo-google-fonts/plus-jakarta-sans @expo-google-fonts/amiri react-native-svg expo-splash-screen \
            expo-location expo-notifications expo-haptics >> ../bootstrap.txt 2>&1
          npx expo install --dev typescript @types/react >> ../bootstrap.txt 2>&1 || true
          {
            echo "== versions"; node -e 'const p=require("./package.json");console.log(JSON.stringify({deps:p.dependencies,dev:p.devDependencies,main:p.main},null,2))'
            echo "== files"; ls -la; cat app.json; cat tsconfig.json
          } >> ../bootstrap.txt
      - name: Save to the branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          printf 'node_modules/\n.expo/\ndist/\n*.tsbuildinfo\n' > mobile/.gitignore.ci
          cat mobile/.gitignore.ci >> mobile/.gitignore || mv mobile/.gitignore.ci mobile/.gitignore
          rm -f mobile/.gitignore.ci
          git add mobile bootstrap.txt
          git commit -m "Scaffold Expo app [skip ci]" && git push
