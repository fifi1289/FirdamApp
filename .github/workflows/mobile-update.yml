# Sends an over-the-air update to the Firdam app people installed from the
# App Store / Google Play (channel "production"). Only for code-only changes:
# the update reaches store builds made with the same Expo SDK (runtime
# policy "sdkVersion"), so a change that adds native code needs a new store build.
# Run it by hand: GitHub → Actions → "Mobile update (store app)" → Run workflow.
name: Mobile update (store app)

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in Expo)
        required: true
        type: string

concurrency:
  group: mobile-update-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish to the store app (production channel)
        env:
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --message "$MESSAGE" --non-interactive
