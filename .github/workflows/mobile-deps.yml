# Temporary helper (run 6: sign in with Apple/Google): runs package commands for mobile/ (npm isn't reachable from
# the coding session) and commits the updated package files back.
name: mobile-deps
on:
  push:
    branches: ['feature/mobile-*']
    paths: ['.github/workflows/mobile-deps.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update packages
        run: |
          {
            npm ci --no-audit --no-fund > /dev/null 2>&1
            echo "== install"; npx expo install expo-apple-authentication expo-web-browser 2>&1 | tail -8
            echo "== expo check"; npx expo install --check 2>&1 | tail -10
            echo "== deps"; node -p 'JSON.stringify([require("./package.json").dependencies["expo-apple-authentication"], require("./package.json").dependencies["expo-web-browser"]])'
          } > ../deps-report.txt
      - name: Save
        if: always()
        working-directory: .
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add mobile/package.json mobile/package-lock.json deps-report.txt
          git commit -m "Update mobile packages [skip ci]" && git push
