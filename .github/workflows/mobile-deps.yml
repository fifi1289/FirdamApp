# Temporary helper (run 8: upgrade to Expo SDK 58): runs package commands for mobile/ (npm isn't reachable from
# the coding session) and commits the updated package files back.
name: mobile-deps
on:
  push:
    branches: ['feature/mobile-*']
    paths: ['.github/workflows/mobile-deps.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update packages
        run: |
          {
            npm ci --no-audit --no-fund > /dev/null 2>&1
            echo "== upgrade"; npx expo install expo@^58.0.0 2>&1 | tail -8
            echo "== conflict"; cat ~/.npm/_logs/*eresolve-report.txt 2>/dev/null | head -40
            echo "== fix"; npx expo install --fix -- --legacy-peer-deps 2>&1 | tail -15
            echo "== check"; npx expo install --check 2>&1 | tail -15
            echo "== doctor"; npx expo-doctor@latest 2>&1 | tail -25
            echo "== typecheck"; npx tsc --noEmit 2>&1 | tail -60
          } > ../deps-report.txt
      - name: Save
        if: always()
        working-directory: .
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add mobile/package.json mobile/package-lock.json deps-report.txt
          git commit -m "Update mobile packages [skip ci]" && git push
